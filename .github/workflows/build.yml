name: Build

"on":
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            triplet: x64-linux
          - name: macOS
            os: macos-latest
            triplet: arm64-osx
          - name: Windows
            os: windows-latest
            triplet: x64-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install Linux build dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          autoconf
          autoconf-archive
          automake
          libegl1-mesa-dev
          libltdl-dev
          libtool
          libwayland-dev
          libx11-dev
          libxext-dev
          libxft-dev
          libxkbcommon-dev
        if: runner.os == 'Linux'

      - name: Install vcpkg
        shell: bash
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" pull --ff-only
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
        if: runner.os != 'Windows'

      - name: Install vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/.git")) {
            Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          } else {
            git -C "$env:VCPKG_ROOT" pull --ff-only
          }
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
        if: runner.os == 'Windows'

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
